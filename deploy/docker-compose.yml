version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: timely
      POSTGRES_USER: timely
      POSTGRES_PASSWORD: timely
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://timely:timely@db:5432/timely
      SECRET_KEY: change-me
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: ../backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://timely:timely@db:5432/timely
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  web:
    build: ../web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    ports:
      - "80:80"

volumes:
  db_data:
